<div class="modal-overlay" id="loginOverlay">
  <div class="login-modal">
    <button class="modal-close" id="loginClose">✕</button>

    <div class="modal-form-side">
      <h2>Welcome Back</h2>
      <p>Sign in to your account to continue.</p>

      <div class="error-banner" id="loginError"></div>
      <div class="success-banner" id="loginSuccess"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <div class="input-icon-wrap">
            <span class="input-icon-left">✉️</span>
            <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-icon-wrap">
            <span class="input-icon-left">🔒</span>
            <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
            <button type="button" class="toggle-password" id="togglePassword">👁️</button>
          </div>
        </div>

        <div class="form-row-between">
          <label class="remember-me">
            <input type="checkbox">
            Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
      </form>
    </div>

    <div class="modal-image-side">
      <img src="images/login-visual.png" alt="controller illustration">
      <div class="modal-tagline">Play. Save. Repeat.</div>
    </div>
  </div>
</div>
